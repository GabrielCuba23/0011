name: Publicar Vigía Perú
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: python scripts/collect.py
      - name: Restaurar último reporte automático ANA
        uses: actions/cache/restore@v4
        with:
          path: .ana-cache
          key: ana-reports-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ana-reports-
      - name: Consultar reporte público ANA
        run: node scripts/collect_ana_rivers.mjs
      - name: Conservar última descarga ANA y su estado
        uses: actions/cache/save@v4
        with:
          path: .ana-cache
          key: ana-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
